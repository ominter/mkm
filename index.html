<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff758c,#ff7eb3);
text-align:center;
color:white;
overflow-x:hidden;
}

.container{
padding:30px;
}

h1{
font-size:50px;
margin-top:20px;
}

p{
font-size:20px;
margin:20px auto;
max-width:700px;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff4081;
cursor:pointer;
font-weight:bold;
margin:20px;
}

button:hover{
background:#ff4081;
color:white;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
padding:30px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
border:4px solid white;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.05);
}

.heart{
position:fixed;
bottom:-20px;
color:white;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Happy Birthday My Love ❤️</h1>

<p>
Wishing you endless happiness, success and love.
May your smile always shine brighter than the stars.
💖 Happy Birthday! 💖
</p>

<button onclick="wish()">Click Here 🎁</button>

</div>

<div class="gallery">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
<img src="photo7.jpg">
<img src="photo8.jpg">

</div>

<script>

function wish(){
alert("🎉 Happy Birthday ❤️\n\nMay all your dreams come true! 💖");
}

function heart(){

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*20)+"px";
h.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},6000);

}

setInterval(heart,300);

</script>

</body>
</html>
